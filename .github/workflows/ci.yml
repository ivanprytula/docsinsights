name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Code quality: linting, type checking, formatting
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
      - name: Install dependencies
        run: |
          uv sync
          bun ci
      - name: Lint frontend
        run: bun run lint
      - name: Lint backend (ruff, ty)
        run: cd backend && uv run ruff check app && uv run ty check app

  # Backend unit tests with coverage
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
      - name: Install backend dependencies
        run: cd backend && uv sync
      - name: Migrate database
        run: cd backend && uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/test
          SECRET_KEY: test-secret-key-for-ci
          PROJECT_NAME: docsinsights
          FIRST_SUPERUSER: admin@example.com
          FIRST_SUPERUSER_PASSWORD: changeme
      - name: Run tests with coverage
        run: cd backend && FASTAPI_ENV=development uv run pytest tests/ --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=80
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-backend
          path: backend/htmlcov
          include-hidden-files: true

  # Frontend E2E tests with Playwright
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
      fail-fast: false
    env:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docsinsights
      SECRET_KEY: test-secret-key-for-ci
      PROJECT_NAME: docsinsights
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: changeme
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
      - uses: taiki-e/install-action@74dc3166e16a005928e9ef53b1f47b352e2986bb # v2.46.0
        with:
          tool: just
      - name: Install dependencies
        run: |
          uv sync
          bun ci
      - name: Generate frontend SDK
        run: just generate-client
      - name: Build and start stack
        run: |
          docker compose build
          docker compose down -v --remove-orphans
          docker compose run --rm backend uv run alembic upgrade head
          docker compose up -d --wait backend
      - name: Run Playwright tests
        run: docker compose run --rm playwright bunx playwright test --fail-on-flaky-tests --trace=retain-on-failure --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: frontend/blob-report
          include-hidden-files: true
          retention-days: 1

  # Smoke test: Docker Compose stack health
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docsinsights
      SECRET_KEY: test-secret-key-for-ci
      PROJECT_NAME: docsinsights
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: changeme
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build stack
        run: docker compose build
      - name: Start stack
        run: |
          docker compose down -v --remove-orphans
          docker compose run --rm backend uv run alembic upgrade head
          docker compose up -d --wait backend adminer
      - name: Health check - API
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Health check - Frontend
        run: curl http://localhost:8000
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  # Branch protection: all checks must pass
  ci-pass:
    if: always()
    needs:
      - code-quality
      - test-backend
      - test-frontend
      - smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
